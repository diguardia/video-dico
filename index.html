<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Video Dico</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: manipulation;
      }
      #app {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: #000;
      }
      #player {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: none;
      }
      #status {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: #bbb;
        letter-spacing: 0.02em;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Video toggle app">
      <video id="player" preload="auto" playsinline webkit-playsinline loop src="./luis.mp4"></video>
      <div id="status">Toque para reproducir</div>
    </main>
    <script>
      var app = document.getElementById("app");
      var video = document.getElementById("player");
      var statusLabel = document.getElementById("status");
      var DEFAULT_VIDEO_URL = "./luis.mp4";
      var FALLBACK_VIDEO_URL = "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4";
      var isPlaying = false;
      var wakeLock = null;
      var triedFallback = false;

      video.src = DEFAULT_VIDEO_URL;

      function requestWakeLock() {
        if (wakeLock) return;
        if (!("wakeLock" in navigator)) return;
        navigator.wakeLock
          .request("screen")
          .then(function (lock) {
            wakeLock = lock;
            if (wakeLock && wakeLock.addEventListener) {
              wakeLock.addEventListener("release", function () {
                wakeLock = null;
              });
            }
          })
          .catch(function (error) {
            if (statusLabel.textContent === "" || statusLabel.textContent === "Toque para reproducir") {
              statusLabel.textContent =
                error && error.name === "NotAllowedError"
                  ? "Permiso de Wake Lock denegado"
                  : "Wake Lock no disponible";
            }
          });
      }

      function showBlackScreen() {
        isPlaying = false;
        video.pause();
        video.currentTime = 0;
        video.style.display = "none";
        statusLabel.textContent = "Toque para reproducir";
      }

      function showVideo() {
        var playResult;
        isPlaying = true;
        video.style.display = "block";
        statusLabel.textContent = "";

        try {
          playResult = video.play();
        } catch (error) {
          isPlaying = false;
          video.style.display = "none";
          statusLabel.textContent = "No se pudo reproducir el video";
          return;
        }

        if (playResult && typeof playResult.then === "function") {
          playResult.catch(function () {
            isPlaying = false;
            video.style.display = "none";
            statusLabel.textContent = "No se pudo reproducir el video";
          });
        }
      }

      video.addEventListener("error", function () {
        if (triedFallback) {
          showBlackScreen();
          statusLabel.textContent = "Error cargando video";
          return;
        }
        triedFallback = true;
        video.src = FALLBACK_VIDEO_URL;
        if (isPlaying) {
          showVideo();
        }
      });

      function toggleScreen() {
        requestWakeLock();
        if (isPlaying) {
          showBlackScreen();
        } else {
          showVideo();
        }
      }

      app.addEventListener("click", toggleScreen);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          requestWakeLock();
        }
      });

      showBlackScreen();
    </script>
  </body>
</html>
