<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Video Dico</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: manipulation;
      }
      #app {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: #000;
      }
      #player {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: none;
      }
      #status {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: #bbb;
        letter-spacing: 0.02em;
        user-select: none;
      }
      #debug {
        display: none;
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        max-height: 40%;
        overflow: auto;
        padding: 8px;
        border: 1px solid #333;
        background: rgba(0, 0, 0, 0.8);
        color: #9fe29f;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.35;
        white-space: pre-wrap;
      }
      body.debug #debug {
        display: block;
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Video toggle app">
      <video id="player" preload="auto" playsinline webkit-playsinline loop src="./luis-android-ultra.mp4"></video>
      <div id="status">Toque para reproducir</div>
      <div id="debug" aria-live="polite"></div>
    </main>
    <script>
      var app = document.getElementById("app");
      var video = document.getElementById("player");
      var statusLabel = document.getElementById("status");
      var debugBox = document.getElementById("debug");
      var DEFAULT_VIDEO_URL = "./luis-android-ultra.mp4";
      var FALLBACK_VIDEO_URL = "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4";
      var SOURCE_CANDIDATES = [
        "./luis-android-ultra.mp4",
        "./luis-android-safe.mp4",
        "./luis-android-compat.mp4",
        "./luis-android.mp4",
        "./luis.mp4",
        "./luis-android.3gp",
        FALLBACK_VIDEO_URL
      ];
      var query = window.location.search || "";
      var isDebug = query.indexOf("debug=1") !== -1;
      var mp4Support = "";
      var isPlaying = false;
      var wakeLock = null;
      var sourceIndex = 0;
      var playWatchdogId = null;

      if (isDebug) {
        document.body.className = document.body.className
          ? document.body.className + " debug"
          : "debug";
      }

      function appendDebug(message) {
        if (!isDebug) return;
        var now = new Date();
        var hh = ("0" + now.getHours()).slice(-2);
        var mm = ("0" + now.getMinutes()).slice(-2);
        var ss = ("0" + now.getSeconds()).slice(-2);
        var line = "[" + hh + ":" + mm + ":" + ss + "] " + message;
        debugBox.textContent += (debugBox.textContent ? "\n" : "") + line;
        debugBox.scrollTop = debugBox.scrollHeight;
      }

      function videoErrorLabel(err) {
        var code = err && err.code;
        if (code === 1) return "MEDIA_ERR_ABORTED";
        if (code === 2) return "MEDIA_ERR_NETWORK";
        if (code === 3) return "MEDIA_ERR_DECODE";
        if (code === 4) return "MEDIA_ERR_SRC_NOT_SUPPORTED";
        return "UNKNOWN";
      }

      function statusSnapshot() {
        var snap =
          "readyState=" +
          video.readyState +
          " networkState=" +
          video.networkState +
          " paused=" +
          video.paused +
          " currentTime=" +
          video.currentTime.toFixed(2);
        appendDebug(snap);
      }

      function isMp4LikelySupported() {
        if (!video.canPlayType) return true;
        mp4Support = video.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"');
        appendDebug("canPlayType baseline mp4=" + (mp4Support || "no"));
        return mp4Support === "probably" || mp4Support === "maybe";
      }

      function setActiveSource(index) {
        sourceIndex = index;
        video.src = SOURCE_CANDIDATES[sourceIndex] || DEFAULT_VIDEO_URL;
        appendDebug("video.src=" + video.src + " (idx=" + sourceIndex + ")");
      }

      setActiveSource(0);

      function requestWakeLock() {
        if (wakeLock) return;
        if (!("wakeLock" in navigator)) return;
        navigator.wakeLock
          .request("screen")
          .then(function (lock) {
            wakeLock = lock;
            if (wakeLock && wakeLock.addEventListener) {
              wakeLock.addEventListener("release", function () {
                wakeLock = null;
              });
            }
          })
          .catch(function (error) {
            appendDebug("WakeLock error: " + (error && error.name ? error.name : "unknown"));
            if (statusLabel.textContent === "" || statusLabel.textContent === "Toque para reproducir") {
              statusLabel.textContent =
                error && error.name === "NotAllowedError"
                  ? "Permiso de Wake Lock denegado"
                  : "Wake Lock no disponible";
            }
          });
      }

      function showBlackScreen() {
        isPlaying = false;
        if (playWatchdogId) {
          clearTimeout(playWatchdogId);
          playWatchdogId = null;
        }
        video.pause();
        video.currentTime = 0;
        video.style.display = "none";
        statusLabel.textContent = "Toque para reproducir";
        appendDebug("Pantalla negra");
      }

      function showVideo() {
        var playResult;
        var label;

        isMp4LikelySupported();

        isPlaying = true;
        video.style.display = "block";
        statusLabel.textContent = "Cargando video...";
        appendDebug("Intentando reproducir");
        statusSnapshot();

        if (playWatchdogId) {
          clearTimeout(playWatchdogId);
        }
        playWatchdogId = setTimeout(function () {
          if (isPlaying && video.paused) {
            statusLabel.textContent = "El video no inicio (" + videoErrorLabel(video.error) + ")";
            appendDebug("Watchdog: video sigue en pausa luego de 4s");
            statusSnapshot();
          }
        }, 4000);

        try {
          video.load();
          playResult = video.play();
        } catch (error) {
          isPlaying = false;
          video.style.display = "none";
          label = videoErrorLabel(video.error);
          statusLabel.textContent = "No se pudo reproducir (" + label + ") fuente " + (sourceIndex + 1);
          appendDebug("play() throw: " + (error && error.message ? error.message : "sin detalle"));
          appendDebug("src activo: " + video.currentSrc);
          return;
        }

        if (playResult && typeof playResult.then === "function") {
          playResult.catch(function () {
            isPlaying = false;
            video.style.display = "none";
            label = videoErrorLabel(video.error);
            statusLabel.textContent = "No se pudo reproducir (" + label + ") fuente " + (sourceIndex + 1);
            appendDebug("play() promise rejected");
            appendDebug("src activo: " + video.currentSrc);
            statusSnapshot();
          });
        }
      }

      video.addEventListener("loadedmetadata", function () {
        appendDebug("Evento: loadedmetadata " + video.videoWidth + "x" + video.videoHeight);
      });

      video.addEventListener("canplay", function () {
        appendDebug("Evento: canplay");
      });

      video.addEventListener("playing", function () {
        if (playWatchdogId) {
          clearTimeout(playWatchdogId);
          playWatchdogId = null;
        }
        statusLabel.textContent = "Reproduciendo";
        appendDebug("Evento: playing");
        statusSnapshot();
      });

      video.addEventListener("stalled", function () {
        appendDebug("Evento: stalled");
        statusSnapshot();
      });

      video.addEventListener("waiting", function () {
        appendDebug("Evento: waiting");
        statusSnapshot();
      });

      video.addEventListener("error", function () {
        var label = videoErrorLabel(video.error);
        appendDebug("Evento: error " + label);
        statusSnapshot();
        if (sourceIndex >= SOURCE_CANDIDATES.length - 1) {
          showBlackScreen();
          statusLabel.textContent = "Error cargando video (" + label + ")";
          return;
        }
        sourceIndex += 1;
        appendDebug("Probando siguiente fuente idx=" + sourceIndex);
        setActiveSource(sourceIndex);
        if (isPlaying) {
          showVideo();
        }
      });

      function toggleScreen() {
        appendDebug("Tap detectado");
        requestWakeLock();
        if (isPlaying) {
          showBlackScreen();
        } else {
          showVideo();
        }
      }

      app.addEventListener("click", toggleScreen);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          appendDebug("visibilitychange: visible");
          requestWakeLock();
        }
      });

      appendDebug("UA: " + navigator.userAgent);
      showBlackScreen();
    </script>
  </body>
</html>
